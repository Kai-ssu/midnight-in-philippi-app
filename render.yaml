services:
  - type: web
    name: midnight-in-philippi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn philippi.wsgi
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: LEADER_CODE # passcode for the answer key; set it in the Render dashboard
        sync: false
